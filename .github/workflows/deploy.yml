name: Deploy to Firebase
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
  deploy:
    needs: check
    # Публікація на https://driver-aps.web.app — вмикається, коли в репозиторії
    # є секрет FIREBASE_SERVICE_ACCOUNT (див. README).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::Секрет FIREBASE_SERVICE_ACCOUNT не задано — публікацію пропущено."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: env.HAS_KEY == 'true'
        run: npm ci
      # Правила доступу до бази (site/firestore.rules)
      - if: env.HAS_KEY == 'true'
        name: Deploy Firestore rules
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only firestore:rules --project driver-aps --config site/firebase.json --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: driver-aps
          entryPoint: site
