<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071330">
  <title>Час у дорозі</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Час у дорозі</h1>
  </header>

  <main>
    <section class="card now" aria-live="polite">
      <div class="status" id="status">Не на зміні</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="sub" id="sub">&nbsp;</div>
      <button id="mainBtn" class="btn big start">▶ Почати роботу</button>
      <button id="breakBtn" class="btn secondary" hidden>☕ Перерва</button>
    </section>

    <section class="stats">
      <div class="stat"><span>Сьогодні</span><b id="sToday">0 год 00 хв</b></div>
      <div class="stat"><span>Цей тиждень</span><b id="sWeek">0 год 00 хв</b></div>
      <div class="stat"><span>Цей місяць</span><b id="sMonth">0 год 00 хв</b></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Історія змін</h2>
        <button id="exportBtn" class="btn small">⬇ CSV</button>
      </div>
      <ul id="history" class="history"></ul>
      <p id="empty" class="muted">Ще немає жодної зміни.</p>
    </section>
  </main>

  <dialog id="editDlg">
    <form method="dialog" id="editForm">
      <h3>Редагувати зміну</h3>
      <label>Початок <input type="datetime-local" id="eStart" required></label>
      <label>Кінець <input type="datetime-local" id="eEnd" required></label>
      <label>Перерви, хв <input type="number" id="eBreak" min="0" step="1"></label>
      <label>Нотатка <input type="text" id="eNote" maxlength="200" placeholder="Маршрут, авто…"></label>
      <p id="eErr" class="err"></p>
      <div class="row">
        <button value="delete" class="btn danger small" formnovalidate>Видалити</button>
        <span>
          <button value="cancel" class="btn small" formnovalidate>Скасувати</button>
          <button value="save" class="btn small start">Зберегти</button>
        </span>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
