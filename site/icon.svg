<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14306b"/>
      <stop offset="1" stop-color="#071330"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.25) translate(-256 -256)">
  <!-- кермо -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#rim)" stroke-width="44"/>
  <!-- спиці: ліва, права, нижня -->
  <path d="M112 280 C170 280 196 300 212 318 M400 280 C342 280 316 300 300 318 M256 344 V400"
        stroke="url(#rim)" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- маточина-циферблат -->
  <circle cx="256" cy="270" r="70" fill="#0b1d45" stroke="#2563eb" stroke-width="10"/>
  <!-- стрілки годинника -->
  <path d="M256 270 V222 M256 270 L290 290" stroke="#eef3ff" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="270" r="11" fill="#2dd4bf"/>
  </g>
</svg>
